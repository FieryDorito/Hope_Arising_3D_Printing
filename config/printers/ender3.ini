# Creality Ender 3 (stock, 0.4 mm nozzle, Bowden extruder, 220x220x250)
# PrusaSlicer config format. Changing this changes every print — test after editing.
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
gcode_flavor = marlin2
use_relative_e_distances = 1
retract_length = 5
retract_speed = 45
retract_lift = 0
z_offset = 0
machine_max_acceleration_extruding = 500
machine_max_acceleration_retracting = 1000
machine_max_acceleration_travel = 500
machine_max_feedrate_x = 500
machine_max_feedrate_y = 500
machine_max_feedrate_z = 5
machine_max_feedrate_e = 60
machine_limits_usage = time_estimate_only
start_gcode = G90\nM83\nM140 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature]\nG28\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG1 Z2.0 F3000\nG1 X0.1 Y20 Z0.3 F5000\nG1 X0.1 Y200 Z0.3 F1500 E15\nG1 X0.4 Y200 Z0.3 F5000\nG1 X0.4 Y20 Z0.3 F1500 E15\nG1 Z2.0 F3000
layer_gcode = G92 E0
end_gcode = M104 S0\nM140 S0\nG91\nG1 Z10 F600\nG90\nG1 X0 Y220 F3000\nM106 S0\nM84
