# Bambu Lab P2S (256x256x256, 0.4 mm nozzle) - FOR ESTIMATES ONLY.
# The P2S prints .3mf files sliced in Bambu Studio, not G-code from this app, so nothing
# made with this profile is ever sent to the printer. The app slices with it only to show
# a rough print time, plastic weight and cost. Bambu Studio shows the exact numbers.
# Print speeds come from config/process/*.ini (made for the Ender 3), so the time shown
# is on the long side for this printer; plastic weight is close.
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 256
nozzle_diameter = 0.4
gcode_flavor = marlin2
use_relative_e_distances = 1
retract_length = 0.8
retract_speed = 30
z_offset = 0
machine_max_acceleration_extruding = 10000
machine_max_acceleration_retracting = 5000
machine_max_acceleration_travel = 10000
machine_max_feedrate_x = 500
machine_max_feedrate_y = 500
machine_max_feedrate_z = 20
machine_max_feedrate_e = 30
machine_limits_usage = time_estimate_only
start_gcode = ; ESTIMATE ONLY - do not print this file\nG28
layer_gcode = G92 E0
end_gcode = M104 S0\nM140 S0\nM84
