# Shop settings. Students/maintainers edit this file — shop operators never need to.
# Machine-specific overrides (API keys, slicer path) go in settings.local.yaml,
# which is NOT committed to GitHub. See settings.local.example.yaml.

library:
  # Google Sheet holding the parts catalog ("Parts Library Sources").
  # The sheet must be shared as "Anyone with the link can view" for the Update button to work.
  sheet_id: 1FbthCGJGbLa-tIOTBgTZSTdRm4-Zagq2RrbnWfNAhuY
  sheet_gid: 0
  catalog_csv: models/sources.csv
  models_dir: models

printer:
  name: Creality Ender 3
  profile: config/printers/ender3.ini
  bed_x_mm: 220
  bed_y_mm: 220
  max_z_mm: 250
  # Keep parts this far from the bed edges.
  margin_mm: 5

materials:
  # key: what the operator sees. price is per kg in Ethiopian Birr (update from Robox catalog).
  PLA:
    profile: config/filaments/pla.ini
    price_per_kg: 1500
    note: Everyday parts. Not for hot places or outdoors in the sun.
  PETG:
    profile: config/filaments/petg.ini
    price_per_kg: 1800
    note: Tougher, handles heat and water better.

strength:
  Normal:
    profile: config/process/standard.ini
    note: Most household parts.
  Strong:
    profile: config/process/strong.ini
    note: Parts that carry weight (hooks, brackets, hinges). Uses more plastic.

slicer:
  # prusaslicer (tested) or orcaslicer (experimental, not yet tested)
  backend: prusaslicer
  # Leave blank to find it automatically. On Windows this is usually
  # C:\Program Files\Prusa3D\PrusaSlicer\prusa-slicer-console.exe
  executable: ""
  timeout_s: 600

agent:
  # Which AI to use: gemini (free tier, for testing), claude, ollama (free, offline), or none.
  # Switching is just changing this word. Keys go in settings.local.yaml, never here.
  provider: gemini
  max_tokens: 1024
  timeout_s: 40          # one try
  total_wait_s: 100      # all tries (retry + fallback model) together
  providers:
    gemini:
      # Free: get a key at https://aistudio.google.com/apikey (no credit card).
      # Free-tier prompts may be read by Google to improve its products -
      # fine for testing, don't type customers' personal details.
      type: openai_compatible
      label: Gemini
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      model: gemini-3.8-flash
      # Tried in order if the main model is busy or too slow (both free tier).
      fallback_models: [gemini-3.5-flash-lite]
      api_key_env: GEMINI_API_KEY
    claude:
      # Paid (Anthropic API credits). Key from https://console.anthropic.com
      type: claude
      model: claude-sonnet-5-5
      api_key_env: ANTHROPIC_API_KEY
    ollama:
      # Free and offline: install Ollama, run `ollama pull llama3.2`, then set provider: ollama.
      # Needs a reasonably fast computer; answers are less reliable than Gemini/Claude.
      type: openai_compatible
      label: Local AI
      base_url: http://localhost:11434/v1/
      model: llama3.2
      needs_key: false

jobs_dir: jobs
currency: ETB
