# Shop settings. Students/maintainers edit this file — shop operators never need to.
# Machine-specific overrides (API keys, slicer path) go in settings.local.yaml,
# which is NOT committed to GitHub. See settings.local.example.yaml.

library:
  # Google Sheet holding the parts catalog ("Parts Library Sources").
  # The sheet must be shared as "Anyone with the link can view" for the Update button to work.
  sheet_id: 1FbthCGJGbLa-tIOTBgTZSTdRm4-Zagq2RrbnWfNAhuY
  sheet_gid: 0
  catalog_csv: models/sources.csv
  models_dir: models

# Every printer the shop (or a student) can print on. The first one is picked by default.
# The worker chooses the printer in step 2, and the app checks the part fits THAT bed.
#
#   output: gcode  The app slices the part and gives a .gcode for the SD card / Wi-Fi.
#                  Needs `profile`: a PrusaSlicer .ini made for that printer (see config/printers/).
#                  Use for Ender 3 and other Marlin printers, Prusa, and Klipper printers.
#   output: 3mf    The app arranges the plate and gives a .3mf. The worker opens it in the
#                  printer's own slicer (`slicer_app`), slices and prints from there.
#                  Use for printers that won't run plain G-code from a card, like Bambu Lab.
#                  `profile` is optional here and only used to estimate time, plastic and cost.
#
# Adding a printer: copy one entry, change the name and bed size, and (for gcode) make its
# .ini by exporting "Printer settings" from PrusaSlicer into config/printers/. Then run pytest.
printers:
  - name: Creality Ender 3
    output: gcode
    profile: config/printers/ender3.ini
    bed_x_mm: 220
    bed_y_mm: 220
    max_z_mm: 250
    # Keep parts this far from the bed edges.
    margin_mm: 5
    note: Save to the SD card and put it in the printer.

  - name: Bambu Lab P2S
    output: 3mf
    slicer_app: Bambu Studio
    profile: config/printers/bambu_p2s_estimate.ini   # estimates only, never sent to the printer
    bed_x_mm: 256
    bed_y_mm: 256
    max_z_mm: 256
    margin_mm: 5
    note: Open the file in Bambu Studio, then print from there.

materials:
  # key: what the operator sees. price is per kg in Ethiopian Birr (update from Robox catalog).
  PLA:
    profile: config/filaments/pla.ini
    price_per_kg: 1500
    note: Everyday parts. Not for hot places or outdoors in the sun.
  PETG:
    profile: config/filaments/petg.ini
    price_per_kg: 1800
    note: Tougher, handles heat and water better.

strength:
  Normal:
    profile: config/process/standard.ini
    note: Most household parts.
  Strong:
    profile: config/process/strong.ini
    note: Parts that carry weight (hooks, brackets, hinges). Uses more plastic.

slicer:
  # prusaslicer (tested) or orcaslicer (experimental, not yet tested)
  backend: prusaslicer
  # Leave blank to find it automatically. On Windows this is usually
  # C:\Program Files\Prusa3D\PrusaSlicer\prusa-slicer-console.exe
  executable: ""
  timeout_s: 600

agent:
  # Which AI to use: gemini (free tier, for testing), claude, ollama (free, offline), or none.
  # Switching is just changing this word. Keys go in settings.local.yaml, never here.
  provider: gemini
  max_tokens: 1024
  timeout_s: 40          # one try
  total_wait_s: 100      # all tries (retry + fallback model) together
  providers:
    gemini:
      # Free: get a key at https://aistudio.google.com/apikey (no credit card).
      # Free-tier prompts may be read by Google to improve its products -
      # fine for testing, don't type customers' personal details.
      type: openai_compatible
      label: Gemini
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      model: gemini-3.8-flash
      # Tried in order if the main model is busy or too slow (both free tier).
      fallback_models: [gemini-3.5-flash-lite]
      api_key_env: GEMINI_API_KEY
    claude:
      # Paid (Anthropic API credits). Key from https://console.anthropic.com
      type: claude
      model: claude-sonnet-5-5
      api_key_env: ANTHROPIC_API_KEY
    ollama:
      # Free and offline: install Ollama, run `ollama pull llama3.2`, then set provider: ollama.
      # Needs a reasonably fast computer; answers are less reliable than Gemini/Claude.
      type: openai_compatible
      label: Local AI
      base_url: http://localhost:11434/v1/
      model: llama3.2
      needs_key: false

jobs_dir: jobs
currency: ETB

# Printers that can receive files over Wi-Fi (EXPERIMENTAL, not yet tried on a real printer).
# Needs Klipper + Moonraker on the printer. Ender 3 printers use the SD card instead.
# Leave empty and the "Send over Wi-Fi" button stays switched off.
network_printers: []
#  - name: K1C by the window
#    address: 192.168.1.50
