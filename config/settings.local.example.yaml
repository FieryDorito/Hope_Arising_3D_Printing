# Copy this file to settings.local.yaml (same folder) and fill in ONE key.
# settings.local.yaml is ignored by git, so keys never end up on GitHub.
# Anything here overrides config/settings.yaml.

agent:
  provider: gemini          # gemini (free) | claude (paid) | ollama (free, offline) | none
  providers:
    gemini:
      api_key: "paste-your-Gemini-key-here"     # https://aistudio.google.com/apikey
